name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test-audit:
    name: Lint + tests + npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests (Vitest)
        run: npm run test

      - name: npm audit (con excepciones documentadas en audit-ci.jsonc)
        run: npx audit-ci --config audit-ci.jsonc

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Binario oficial directo en vez de la GitHub Action (que requiere
      # licencia para uso en organizaciones) — mismo comando validado
      # manualmente durante Build 1.
      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          mkdir -p /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin

      - name: Run gitleaks
        run: /tmp/gitleaks-bin/gitleaks detect --source . --no-git -v

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Requiere secrets reales del repo (DATABASE_URL como mínimo). Si no están
    # configurados, el job se salta en vez de fallar en rojo por algo fuera
    # del control del PR — ver tasks/todo.md (bloqueante de credenciales).
    if: ${{ vars.CLOUD_CI_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PUBLIC_SANITY_PROJECT_ID: ${{ secrets.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ secrets.PUBLIC_SANITY_DATASET }}
          IP_HASH_PEPPER: ${{ secrets.IP_HASH_PEPPER }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_TEST_RECIPIENT_EMAIL: ${{ secrets.RESEND_TEST_RECIPIENT_EMAIL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

  lighthouse:
    name: Lighthouse CI (SRS §5 — Performance/A11y/BP/SEO ≥90)
    runs-on: ubuntu-latest
    # index.astro lee Sanity real en build time (contenido editorial) — sin
    # esos secrets el build falla (falla real, no un placeholder silencioso).
    # No necesita DATABASE_URL: Neon solo lo tocan las rutas SSR, no la
    # página estática que mide Lighthouse.
    if: ${{ vars.CLOUD_CI_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_SANITY_PROJECT_ID: ${{ secrets.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ secrets.PUBLIC_SANITY_DATASET }}

      - name: Lighthouse CI
        run: npx lhci autorun
